<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Almanac</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23c2410c'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='Georgia,serif'>A</text></svg>" />
  </head>
  <body>
    <header>
      <div class="brand"><span class="mark">A</span> Almanac</div>
      <div class="model" id="model"></div>
    </header>

    <main id="log">
      <div class="banner" id="banner" hidden></div>
      <section class="empty" id="empty" hidden>
        <h1>Ask me anything.</h1>
        <p>I search the web when the answer can change, and I remember what you asked and when, so you can come back later and ask what's different.</p>
        <div class="examples">
          <button>Cheapest managed Postgres for a small side project right now?</button>
          <button>Shortlist 5 CRM tools for a 20-person sales team</button>
          <button>What did I ask you yesterday?</button>
        </div>
      </section>
    </main>

    <form id="composer">
      <textarea id="input" rows="1" placeholder="Message Almanac" autofocus></textarea>
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <script src="/vendor/marked.js"></script>
    <script src="/vendor/purify.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
